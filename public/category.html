<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Drinks, Tobacco & Accessories — Liqasto</title>
  <meta name="description" content="Browse Kenya's largest collection of authentic spirits, beers, wines, cigarettes, rolling papers and drinkware accessories.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 0%22 100%22 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="page-wrapper">

  <header class="header">
    <div class="header__top">
      <a href="/" class="header__logo">
        <span class="header__logo-icon">🍾</span>
        <span class="header__logo-text">LIQA<span>STO</span></span>
      </a>

      <div class="header__search">
        <form id="header-search-form" class="header__search-form">
          <input type="text" id="header-search-input" class="header__search-input" placeholder="Search products...">
          <button type="submit" class="header__search-btn">🔍</button>
        </form>
        <div id="search-suggestions" class="search-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-xl); z-index: var(--z-dropdown); margin-top: 4px;"></div>
      </div>

      <div class="header__actions" style="display: flex; align-items: center; gap: 16px;">
        <a href="/wishlist.html" class="header__action" style="display: flex; align-items: center; gap: 6px; color: #fff;">
          <span>🤍</span>
          <span class="header__action-label">Wishlist</span>
          <span id="wishlist-badge" class="badge-count" style="display: none;">0</span>
        </a>
        <a href="/cart.html" class="header__action" style="display: flex; align-items: center; gap: 6px; color: #fff; position: relative;">
          <span>🛒</span>
          <span class="header__action-label">Cart</span>
          <span id="cart-badge" class="badge-count" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-content" style="max-width: var(--container-max); margin: 0 auto; padding: 24px 16px; width: 100%;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;">
      <div>
        <h1 id="page-title" style="font-size: var(--text-2xl); margin-bottom: 4px;">All Products</h1>
        <p id="page-subtitle" style="font-size: 13px; color: var(--color-gray-500); margin: 0;">Showing products available for delivery in Kenya</p>
      </div>

      <!-- Sorting -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="sort-select" style="font-size: 13px; color: var(--color-gray-600); font-weight: 600;">Sort By:</label>
        <select id="sort-select" class="form-select" style="font-size: 13px; padding: 6px 12px; border-radius: var(--radius-md);">
          <option value="newest">Newest Arrivals</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: flex-start;">
      <!-- Sidebar Filters -->
      <aside class="sidebar-filters card" style="padding: 20px;">
        <h3 style="font-size: 15px; margin-bottom: 16px; border-bottom: 1px solid var(--color-gray-100); padding-bottom: 8px;">Filter Catalog</h3>

        <div style="margin-bottom: 20px;">
          <h4 style="font-size: 13px; color: var(--color-gray-600); margin-bottom: 8px;">Category</h4>
          <div id="filter-categories" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;">
            <!-- Category links -->
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <h4 style="font-size: 13px; color: var(--color-gray-600); margin-bottom: 8px;">Price (KSh)</h4>
          <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="number" id="min-price" placeholder="Min" class="form-input" style="padding: 6px 8px; font-size: 12px;">
            <input type="number" id="max-price" placeholder="Max" class="form-input" style="padding: 6px 8px; font-size: 12px;">
          </div>
          <button id="apply-price-filter" class="btn btn-secondary btn-sm" style="width: 100%;">Apply Price</button>
        </div>

        <div>
          <button id="reset-filters" class="btn btn-ghost btn-sm" style="width: 100%; color: var(--color-error);">Reset All Filters</button>
        </div>
      </aside>

      <!-- Products Grid -->
      <div>
        <div id="category-products-grid" class="product-grid">
          <!-- Dynamically loaded -->
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" style="background: var(--gradient-footer); color: #fff; padding: 36px 16px 20px; margin-top: auto; text-align: center; font-size: 13px; color: rgba(255,255,255,0.7);">
    © 2026 Liqasto Kenya. Drink responsibly. 18+ only.
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { getProducts, getCategories } from '/js/store.js';
    import { renderProductCard, attachProductCardEvents } from '/js/products.js';
    import { getQueryParam, sanitize } from '/js/utils.js';
    import { emptyState, productSkeletons } from '/js/ui.js';

    let allProducts = [];
    let currentCategoryId = getQueryParam('categoryId');
    let currentSub = getQueryParam('sub');
    let currentSearch = getQueryParam('search');

    async function loadCategoryPage() {
      const grid = document.querySelector('#category-products-grid');
      const pageTitle = document.querySelector('#page-title');
      const filterCatContainer = document.querySelector('#filter-categories');

      grid.innerHTML = productSkeletons(8);

      const [products, categories] = await Promise.all([
        getProducts({
          categoryId: currentCategoryId,
          subCategory: currentSub,
          searchTerm: currentSearch,
          maxItems: 50
        }),
        getCategories()
      ]);

      allProducts = products;

      // Update Page Title
      if (currentSearch) {
        pageTitle.textContent = `Search: "${sanitize(currentSearch)}"`;
      } else if (currentSub) {
        pageTitle.textContent = currentSub;
      } else if (currentCategoryId) {
        const cat = categories.find(c => c.id === currentCategoryId);
        pageTitle.textContent = cat ? cat.name : 'Category Products';
      } else {
        pageTitle.textContent = 'All Products';
      }

      // Render category filter links
      if (filterCatContainer) {
        filterCatContainer.innerHTML = `
          <a href="/category.html" style="color: ${!currentCategoryId ? 'var(--color-emerald-700); font-weight:700;' : 'var(--color-gray-700);'}">All Categories</a>
          ${categories.map(c => `
            <a href="/category.html?categoryId=${c.id}" style="color: ${currentCategoryId === c.id ? 'var(--color-emerald-700); font-weight:700;' : 'var(--color-gray-700);'}">
              ${c.icon || '🏷️'} ${c.name}
            </a>
          `).join('')}
        `;
      }

      renderProducts(allProducts);
      setupSortAndFilters();
    }

    function renderProducts(items) {
      const grid = document.querySelector('#category-products-grid');
      if (items.length === 0) {
        grid.innerHTML = emptyState({
          icon: '🔍',
          title: 'No Products Found',
          text: 'Try searching for something else or clearing filters.',
          actionText: 'View All Products',
          actionUrl: '/category.html'
        });
        return;
      }

      grid.innerHTML = items.map(p => renderProductCard(p)).join('');
      attachProductCardEvents(grid, items);
    }

    function setupSortAndFilters() {
      const sortSelect = document.querySelector('#sort-select');
      const applyPriceBtn = document.querySelector('#apply-price-filter');
      const resetBtn = document.querySelector('#reset-filters');

      sortSelect?.addEventListener('change', () => {
        let sorted = [...allProducts];
        const val = sortSelect.value;
        if (val === 'price-asc') sorted.sort((a,b) => a.price - b.price);
        if (val === 'price-desc') sorted.sort((a,b) => b.price - a.price);
        if (val === 'rating') sorted.sort((a,b) => (b.rating||0) - (a.rating||0));
        renderProducts(sorted);
      });

      applyPriceBtn?.addEventListener('click', () => {
        const min = Number(document.querySelector('#min-price').value || 0);
        const max = Number(document.querySelector('#max-price').value || Infinity);
        const filtered = allProducts.filter(p => p.price >= min && p.price <= max);
        renderProducts(filtered);
      });

      resetBtn?.addEventListener('click', () => {
        window.location.href = '/category.html';
      });
    }

    document.addEventListener('DOMContentLoaded', loadCategoryPage);
  </script>
</body>
</html>
