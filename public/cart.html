<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — Liqasto</title>
  <meta name="description" content="View items in your cart and proceed to secure checkout with M-Pesa or card on Liqasto.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 0%22 100%22 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="page-wrapper">

  <header class="header">
    <div class="header__top">
      <a href="/" class="header__logo">
        <span class="header__logo-icon">🍾</span>
        <span class="header__logo-text">LIQA<span>STO</span></span>
      </a>

      <div style="color: #fff; font-size: 14px; font-weight: 600; margin-left: auto;">
        🔒 Secure Checkout
      </div>
    </div>
  </header>

  <main class="page-content" style="max-width: var(--container-max); margin: 0 auto; padding: 32px 16px; width: 100%;">
    <div id="cart-container">
      <!-- Rendered by cart.js renderCartPage() -->
    </div>
  </main>

  <footer class="footer" style="background: var(--gradient-footer); color: #fff; padding: 28px 16px; margin-top: auto; text-align: center; font-size: 13px; color: rgba(255,255,255,0.7);">
    © 2026 Liqasto Kenya. Same-Day Fast Dispatch. Lipa na M-Pesa.
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { renderCartPage } from '/js/cart.js';
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('#cart-container');
      renderCartPage(container);
    });
  </script>
</body>
</html>
