<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — Liqasto Kenya</title>
  <meta name="description" content="View product specifications, pricing in Kenyan Shillings, and order for same-day delivery on Liqasto.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 0%22 100%22 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="page-wrapper">

  <div style="background: #000; color: #a7f3d0; text-align: center; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;">
    🔞 Strictly 18+ Only • Drink Responsibly • Same-Day Express Delivery Across Nairobi
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header__top">
      <a href="/" class="header__logo">
        <span class="header__logo-icon">🍾</span>
        <span class="header__logo-text">LIQA<span>STO</span></span>
      </a>

      <div class="header__search">
        <form id="header-search-form" class="header__search-form">
          <input type="text" id="header-search-input" class="header__search-input" placeholder="Search drinks, smokes, accessories...">
          <button type="submit" class="header__search-btn">🔍 Search</button>
        </form>
        <div id="search-suggestions" class="search-suggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-xl); z-index: var(--z-dropdown); margin-top: 4px;"></div>
      </div>

      <div class="header__actions" style="display: flex; align-items: center; gap: 16px;">
        <a href="/wishlist.html" class="header__action" style="display: flex; align-items: center; gap: 6px; color: #fff; position: relative;">
          <span>🤍</span>
          <span class="header__action-label">Wishlist</span>
          <span id="wishlist-badge" class="badge-count" style="display: none; position: absolute; top: -6px; left: 12px; background: var(--color-error); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 6px;">0</span>
        </a>
        <a href="/cart.html" class="header__action" style="display: flex; align-items: center; gap: 6px; color: #fff; position: relative;">
          <span>🛒</span>
          <span class="header__action-label">Cart</span>
          <span id="cart-badge" class="badge-count" style="display: none; position: absolute; top: -6px; left: 12px; background: var(--color-emerald-400); color: #022c22; font-size: 10px; font-weight: 800; border-radius: 10px; padding: 2px 6px;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Product Container -->
  <main class="page-content" style="max-width: var(--container-max); margin: 0 auto; padding: 24px 16px; width: 100%;">
    <div id="product-detail-container">
      <!-- Loaded dynamically by products.js -->
      <div style="padding: 40px; text-align: center; color: var(--color-gray-500);">
        Loading product details...
      </div>
    </div>

    <!-- Related Products -->
    <section id="section-related" class="product-section" style="margin-top: 48px;"></section>
  </main>

  <footer class="footer" style="background: var(--gradient-footer); color: #fff; padding: 48px 16px 24px; margin-top: auto;">
    <div style="max-width: var(--container-max); margin: 0 auto; text-align: center; font-size: 13px; color: rgba(255,255,255,0.7);">
      © 2026 Liqasto Kenya. 18+ Verification strictly required upon delivery.
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { renderProductDetailPage, renderProductSection } from '/js/products.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('#product-detail-container');
      renderProductDetailPage(container);

      // Related products
      renderProductSection(document.querySelector('#section-related'), {
        title: 'Customers Also Bought 🌟',
        maxItems: 5,
        isRow: true
      });
    });
  </script>
</body>
</html>
